name: Release Linux packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Install RPM build tooling
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Verify Go module
        run: make check
      - name: Build Debian packages and source archive
        run: |
          make source
          mkdir -p dist
          mv spark-store-tui-source-*.tar.gz dist/
          for arch in amd64 arm64 loong64; do
            make ARCH="$arch" build
            mv "spark-store-tui_"*"_${arch}.deb" dist/
          done
      - name: Build RPM packages
        run: |
          mkdir -p "$HOME/rpmbuild/SOURCES" "$HOME/rpmbuild/SPECS"
          cp dist/spark-store-tui-source-*.tar.gz "$HOME/rpmbuild/SOURCES/"
          cp packaging/rpm/spark-store-tui.spec "$HOME/rpmbuild/SPECS/"
          for target in x86_64 aarch64 loongarch64; do
            rpmbuild -bb --nodeps --target "$target" "$HOME/rpmbuild/SPECS/spark-store-tui.spec"
          done
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' -exec cp {} dist/ \;
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "spark-store-tui $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
